<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giveaway Dapse</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#00c853,#00e676,#2196f3);
background-size:400% 400%;
animation:bg 10s infinite alternate;
}

@keyframes bg{
0%{background-position:left;}
100%{background-position:right;}
}

.card{
width:95%;
max-width:450px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(15px);
border-radius:20px;
padding:35px;
box-shadow:0 15px 40px rgba(0,0,0,.25);
color:white;
}

.logo{
font-size:55px;
text-align:center;
margin-bottom:10px;
}

h1{
text-align:center;
font-size:28px;
margin-bottom:8px;
}

p{
text-align:center;
opacity:.9;
margin-bottom:25px;
}

.input-box{
margin-bottom:18px;
}

.input-box input{
width:100%;
padding:15px;
border:none;
border-radius:12px;
outline:none;
font-size:15px;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:white;
color:#00a152;
font-size:17px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.03);
background:#e8f5e9;
}

.footer{
margin-top:20px;
text-align:center;
font-size:13px;
opacity:.8;
}
</style>

</head>
<body>

<div class="card">

<div class="logo">📱</div>

<h1>Database WhatsApp</h1>

<p>Silakan isi data Anda dengan benar.</p>

<form action="simpan.php" method="POST">

<div class="input-box">
<input
type="text"
name="nama"
placeholder="👤 Nama Lengkap"
required>
</div>

<div class="input-box">
<input
type="text"
name="wa"
placeholder="📞 Nomor WhatsApp"
required>
</div>

<button type="submit">
Kirim Data
</button>

</form>

<div class="footer">
© 2026 Database WhatsApp
</div>

</div>

</body>
</html>
